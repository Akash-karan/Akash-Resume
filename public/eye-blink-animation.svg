<svg id="eye-blink-animation" width="44" height="55" viewBox="0 0 44 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .open-eye,
    .closed-eye,
    .eyebrows {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        opacity 220ms ease-in-out,
        transform 260ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .closed-eye {
      opacity: 0;
      transform: scaleY(0.45) translateY(-0.5px);
    }

    #eye-blink-animation:hover .open-eye {
      opacity: 0;
      transform: scaleY(0.08) translateY(1px);
    }

    #eye-blink-animation:hover .closed-eye {
      opacity: 1;
      transform: scaleY(1) translateY(0);
    }

    #eye-blink-animation:hover .eyebrows {
      transform: translateY(1px) scaleY(0.92);
    }
  </style>

